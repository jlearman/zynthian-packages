description: "Soft warm grand piano.

Osiris Piano is a unique quiet piano, a worn Yamaha C2 grand recorded at half-
stick with the soft pedal down and very low dynamics.

This version removes several features of the original Osiris piano at
https://github.com/sfzinstruments/Osiris_Piano to achieve a small footprint."
