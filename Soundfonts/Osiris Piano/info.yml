description: "A soft warm grand piano. A unique quiet piano based in a worn Yamaha C2 grand recorded at half-
stick with the soft pedal down and very low dynamics.

This version removes several features of the <a href='https://github.com/sfzinstruments/Osiris_Piano'>original Osiris piano</a> 
to achieve a smaller footprint, best suited for zynthian usage."
